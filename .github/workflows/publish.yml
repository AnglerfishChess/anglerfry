# Runs when a GitHub release is published. Uploads to crates.io via trusted
# publishing (OIDC) for AnglerfishChess/anglerfry, environment `crates`; no
# token stored. Gated on the CRATES_PUBLISH repo variable so the bootstrap
# (first manual publish, then registering the trusted publisher) can happen
# before the pipeline arms.
name: Publish

on:
  release:
    types: [published]

jobs:
  crates:
    if: vars.CRATES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.1"
      - name: Verify crate version matches the release tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          [ "$got" = "$want" ] || { echo "crate $got != tag $want" >&2; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
